<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffb6d5">
  <title>PinkTalk 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="logo">💗</span>
        <div>
          <h2>PinkTalk</h2>
          <small>Stay connected</small>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn">⚙️</button>
    </header>

    <section id="authSection" class="auth-section">
      <div class="welcome-icon">💗</div>
      <h1>Welcome to PinkTalk</h1>
      <p>Connect with your friends beautifully.</p>

      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">

      <button id="loginBtn" class="primary-btn">Login</button>
      <button id="signupBtn" class="secondary-btn">Create Account</button>
      <p id="authMessage" class="message"></p>
    </section>

    <main id="mainSection" hidden>

      <section id="chatsPage" class="page">
        <div class="section-heading">
          <h2>Messages 💬</h2>
          <button id="newChatBtn" class="round-btn">＋</button>
        </div>

        <div class="search-box">
          <span>🔍</span>
          <input id="userSearch" placeholder="Search by username...">
        </div>

        <div id="searchResults"></div>
        <div id="chatList" class="chat-list"></div>
      </section>

      <section id="chatPage" class="page" hidden>
        <div class="chat-header">
          <button id="backBtn" class="icon-btn">←</button>
          <div class="chat-user">
            <div id="chatAvatar" class="avatar">💗</div>
            <div>
              <strong id="chatName">Friend</strong>
              <small id="chatUsername">@username</small>
            </div>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <form id="messageForm" class="message-form">
          <input id="messageInput" placeholder="Write a message..." autocomplete="off">
          <button type="submit" class="send-btn">➤</button>
        </form>
      </section>

      <section id="profilePage" class="page" hidden>
        <h2>My Profile 🌸</h2>
        <div class="profile-card">
          <div class="profile-avatar">💗</div>
          <h2 id="profileName">My Profile</h2>
          <p id="profileUsername">@username</p>
          <input id="editName" placeholder="Your name">
          <input id="editUsername" placeholder="Your username">
          <textarea id="editBio" placeholder="Write your bio"></textarea>
          <button id="saveProfileBtn" class="primary-btn">Save Profile</button>
          <p id="profileMessage" class="message"></p>
        </div>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </section>

      <section id="settingsPage" class="page" hidden>
        <h2>Settings ⚙️</h2>

        <div class="setting-card">
          <label for="languageSelect">Language</label>
          <select id="languageSelect">
            <option value="bn">বাংলা</option>
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="ur">اردو</option>
          </select>

          <label class="setting-row">
            <span>Notification Sound</span>
            <input type="checkbox" id="soundToggle" checked>
          </label>

          <label class="setting-row">
            <span>Button Sound</span>
            <input type="checkbox" id="buttonSoundToggle" checked>
          </label>

          <label class="setting-row">
            <span>Dark Mode</span>
            <input type="checkbox" id="darkToggle">
          </label>
        </div>
      </section>

      <nav class="bottom-nav">
        <button data-page="chatsPage" class="nav-btn active">💬<small>Chats</small></button>
        <button data-page="profilePage" class="nav-btn">👤<small>Profile</small></button>
        <button data-page="settingsPage" class="nav-btn">⚙️<small>Settings</small></button>
      </nav>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
    </html>
